name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build

      # The daemon suite starts real processes on real pseudo-terminals, so it
      # needs a machine rather than a container.
      - name: Test
        run: swift test
